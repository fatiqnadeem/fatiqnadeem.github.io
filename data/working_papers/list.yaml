- title: "Religious Institutions and Environmental Regulation &mdash; <ins>Job Market Paper</ins>"
  abstract: "Environmental regulation succeeds when the state can monitor compliance and penalize violators, but in many settings the state can do neither, and the question of whether other institutions can reduce what state enforcement has left behind is largely unanswered. Indonesia has banned land-clearing fires for two decades, yet its laws exempt the smallholders who set most of these fires, and the state rarely enforces them even where they apply. Fires across Sumatra and Kalimantan cause tens of thousands of premature deaths and billions of dollars in damage each year, and increasingly strict statutes have had little deterrent effect. In 2016, at the government’s request, Indonesia’s national council of Islamic scholars declared harmful burning haram, a religious prohibition that imposed no legal penalty and spread through mosques rather than courts. I evaluate the ruling by comparing neighboring villages that differ sharply in their Muslim share, matching Muslim-majority villages to comparison villages within the same district on land, population, location and weather. I find that declaration of burning as haram led to a 78 percent decline in fire detections relative to their pre-ruling mean in matched Muslim-majority villages, a decline that persists across every post-ruling season from 2016 through 2024 and increases with village-level Muslim population shares. These findings suggest that enlisting religious authority to enforce environmental rules can increase social welfare in settings where conventional state enforcement is limited, pointing to a complementary role for non-state institutions in environmental regulation."

- title: "Legalizing Fire on Private Land Increased Burning and Forest Loss on Public and Indigenous Lands"
  coauthors: "Kathryn Baragwanath, Cesar B. Martinez-Alvarez, and Flora (Yifan) He"
  note: "Submitted to PNAS"
  abstract: "Nearly three-quarters of the world's forests sit on government-administered land, where property rights are often weak and fire is the cheapest way to clear vegetation and claim territory. Governments across the tropics nonetheless face recurring pressure to relax restrictions on burning, framed as pro-poor rural development, with little evidence on the consequences for surrounding public lands. We study Bolivia's Supreme Decree 3973 of July 2019, which authorized land clearing and controlled burning on private and communal lands in the departments of Santa Cruz and Beni. Applying a doubly robust difference-in-differences design to satellite records of fire, burned area, land cover, and land tenure from 2015 to 2022, we find that the decree raised fire incidence by 152 percent. Fires doubled on the communal and large private lands the decree authorized, but rose furthest where burning remained illegal: tripling on untitled public land and protected areas and rising more than fivefold on Indigenous territories. Small private properties, the decree's stated beneficiaries, showed no significant change. The additional fires burned predominantly forests and natural grasslands rather than existing farmland; untitled public land suffered the largest primary forest losses of any tenure type and a 13 percent expansion of agricultural land. These fires were ignited on public land, not spread from private properties, while formal sanctions for illegal burning fell from 332 to 39. Fire deregulation on private land thus operates as a signal of impunity that licenses encroachment by fire on public natural landscapes, a spillover that assessments of frontier fire policy must account for."

- title: "Strategic Adaptation & Satellite Blind-Spots: Evidence from Northwestern India and Pakistan"
  coauthors: "Kathryn Baragwanath"
  abstract: "India enforces its crop-residue burning bans with detections from a polar-orbiting satellite that passes at a fixed afternoon hour. Using a geostationary satellite that images northwestern India every ten minutes, we observe the fires the enforcement system misses and find that roughly three quarters of fire activity now occurs outside the monitoring window. Official counts fell by roughly a third while burning continued in the evenings, consistent with farmers shifting when they burn rather than whether they burn in response to predictable enforcement."

- title: "Access to Justice in Times of Pollution: Evidence from South Asia"
  coauthors: "Ali Bakhtawar"
  abstract: "We ask whether exposure to crop-residue smoke changes the decisions of India's district courts. We link daily records from millions of cases to nearby fire detections and wind, summing each court's downwind exposure over the preceding days so that variation comes from shifts in the wind rather than from where courts or fires sit. Judges in downwind courts acquit a smaller share of defendants and decide fewer cases on the day of filing, while bail decisions and caseloads do not change, consistent with smoke changing how and when judges decide rather than how much work they finish."
