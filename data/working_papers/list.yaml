- title: "Forest Fires and Religious Institutions in Indonesia &mdash; <ins>Job Market Paper</ins>"
  abstract: "Land-clearing fires in Indonesia caused an estimated 100,300 excess deaths in 2015, and state-sponsored bans have repeatedly failed because the state can detect fires but cannot attribute them to the farmers who set them. In 2016, Indonesia's highest Islamic authority declared environmentally harmful burning religiously forbidden, a ruling that carried no legal penalty and reached roughly 300,000 mosques through Friday sermons. Comparing adjacent villages across Kalimantan's centuries-old religious frontier, I find that fire detections in Muslim-majority villages fell sharply relative to paired neighbors after the ruling, and the estimated decline persisted through 2024. To my knowledge, this paper gives the first evidence that a religious prohibition can reduce a large environmental harm where state enforcement has not."

- title: "Land-Clearing Deregulation Increased Burning and Forest Loss on Public and Indigenous Lands"
  coauthors: "Kathryn Baragwanath, Yifan He, and Cesar B. Martinez-Alvarez"
  note: "Under review"
  abstract: "Nearly three-quarters of the world's forests sit on government-administered land, where property rights are often weak and fire is the cheapest way to clear vegetation and claim territory. Governments across the tropics nonetheless face recurring pressure to relax restrictions on burning, framed as pro-poor rural development, with little evidence on the consequences for surrounding public lands. We study Bolivia's Supreme Decree 3973 of July 2019, which authorized land clearing and controlled burning on private and communal lands in the departments of Santa Cruz and Beni. Applying a doubly robust difference-in-differences design to satellite records of fire, burned area, land cover, and land tenure from 2015 to 2022, we find that the decree raised fire incidence by 152 percent. Fires doubled on the communal and large private lands the decree authorized, but rose furthest where burning remained illegal: tripling on untitled public land and protected areas and rising more than fivefold on Indigenous territories. Small private properties, the decree's stated beneficiaries, showed no significant change. The additional fires burned predominantly forests and natural grasslands rather than existing farmland; untitled public land suffered the largest primary forest losses of any tenure type and a 13 percent expansion of agricultural land. These fires were ignited on public land, not spread from private properties, while formal sanctions for illegal burning fell from 332 to 39. Fire deregulation on private land thus operates as a signal of impunity that licenses encroachment by fire on public natural landscapes, a spillover that assessments of frontier fire policy must account for."
