- title: "Forest Fires and Religious Institutions in Indonesia &mdash; <ins>Job Market Paper</ins>"
  abstract: "Land-clearing fires in Indonesia caused an estimated 100,300 excess deaths in 2015, and state-sponsored bans have repeatedly failed because the state can detect fires but cannot attribute them to the farmers who set them. In 2016, Indonesia's highest Islamic authority declared environmentally harmful burning religiously forbidden, a ruling that carried no legal penalty and reached roughly 300,000 mosques through Friday sermons. Comparing adjacent villages across Kalimantan's centuries-old religious frontier, I find that fire detections in Muslim-majority villages fell sharply relative to paired neighbors after the ruling, and the estimated decline persisted through 2024. To my knowledge, this paper gives the first evidence that a religious prohibition can reduce a large environmental harm where state enforcement has not."

- title: "Burning the Commons: Fire Encroachment on Bolivia's Public Natural Landscapes"
  coauthors: "Kathryn Baragwanath and Yifan He"
  abstract: "In 2019, Bolivia passed a decree authorizing land clearing and controlled burning on private and communal lands in Santa Cruz and Beni. We compare those departments with similar lowlands elsewhere in Bolivia and find that fires rose most on lands where burning remained illegal, on untitled public land, in protected areas, and on Indigenous territories, while formal sanctions for illegal burning collapsed in the same year. The results are consistent with deregulation signaling impunity to those who encroach on public and Indigenous lands."
